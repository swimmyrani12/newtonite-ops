version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: always
    environment:
      POSTGRES_USER: newtonite_admin
      POSTGRES_PASSWORD: newtonite_secure_password
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite_admin -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - newtonite-net

  backend:
    build: .
    container_name: newtonite-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://newtonite_admin:newtonite_secure_password@postgres:5432/newtonite_ops
      JWT_SECRET: production-secret-key-newtonite-challenge-token
      OUTBOX_POLL_INTERVAL_SECONDS: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newtonite-net

  worker:
    build: .
    container_name: newtonite-outbox-worker
    restart: always
    command: ["python", "-m", "backend.app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://newtonite_admin:newtonite_secure_password@postgres:5432/newtonite_ops
      OUTBOX_POLL_INTERVAL_SECONDS: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newtonite-net

volumes:
  postgres_data:

networks:
  newtonite-net:
    driver: bridge
